<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Calistenika – Gym Deník</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111318" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="index.html">←</a>
    <h1>🤸 Calistenika</h1>
  </div>

  <div class="container">
    <div class="stat-row" id="statsRow">
      <div class="stat-box"><div class="value" id="statSessions">0</div><div class="label">tréninků</div></div>
      <div class="stat-box"><div class="value" id="statWeek">0</div><div class="label">tento týden</div></div>
      <div class="stat-box"><div class="value" id="statExercises">0</div><div class="label">cviků</div></div>
    </div>

    <div class="card">
      <h2 id="calisthenicsFormTitle">Nový trénink</h2>
      <div class="field">
        <label for="sessionDate">Datum</label>
        <input type="date" id="sessionDate" />
      </div>

      <div id="exerciseList"></div>
      <datalist id="exerciseNamesList"></datalist>

      <div class="quick-exercise-row">
        <button class="btn secondary small quick-exercise" data-name="Běh" type="button">+ Běh</button>
        <button class="btn secondary small quick-exercise" data-name="Kliky" type="button">+ Kliky</button>
        <button class="btn secondary small quick-exercise" data-name="Plavání" type="button">+ Plavání</button>
      </div>
      <button class="btn secondary block" id="addExerciseBtn" style="margin-bottom:10px;">+ Přidat vlastní cvik</button>
      <button class="btn block" id="saveSessionBtn">Uložit trénink</button>
      <button class="btn ghost block" id="cancelEditSessionBtn" style="display:none; margin-top:8px;">Zrušit úpravu</button>
    </div>

    <div class="card">
      <h2>Progres</h2>
      <div class="field">
        <label for="progressExercise">Vyber cvik</label>
        <select id="progressExercise"></select>
      </div>
      <div class="stat-row" style="margin-bottom:10px;">
        <div class="stat-box"><div class="value" id="bestValue">–</div><div class="label" id="bestValueLabel">nejlepší výkon</div></div>
        <div class="stat-box"><div class="value" id="bestDate">–</div><div class="label">datum výkonu</div></div>
      </div>
      <div class="chart-wrap">
        <canvas id="progressChart" height="220"></canvas>
      </div>
      <p class="empty-hint" id="progressEmptyHint" style="display:none;">Zatím nemáš u tohoto cviku žádná data.</p>
    </div>

    <div class="card">
      <h2>Historie tréninků</h2>
      <div id="sessionsList"></div>
      <p class="empty-hint" id="sessionsEmptyHint" style="display:none;">Zatím žádné tréninky. Přidej první nahoře ⬆️</p>
    </div>
  </div>

  <script src="js/chart.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/calisthenics.js"></script>
  <script>registerServiceWorker();</script>
</body>
</html>
