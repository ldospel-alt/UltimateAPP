<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Deníček – Gym Deník</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111318" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="index.html">←</a>
    <h1>📔 Deníček</h1>
  </div>

  <div class="container">

    <div class="card">
      <h2>Nový zápisek</h2>
      <div class="field">
        <label>Datum</label>
        <input type="date" id="diaryDate" />
      </div>
      <div class="field">
        <textarea id="diaryText" placeholder="Jak proběhl den...?"></textarea>
      </div>
      <p style="color:var(--text-dim); font-size:13px; margin:0 0 4px 0;">Jak hodnotíš tento den?</p>
      <div class="rating-row">
        <button class="rate-btn rate-minus" data-rating="-">−</button>
        <button class="rate-btn rate-zero" data-rating="0">0</button>
        <button class="rate-btn rate-plus" data-rating="+">+</button>
      </div>
    </div>

    <div class="card">
      <h2>Zápisky</h2>
      <div id="diaryList"></div>
      <p class="empty-hint" id="diaryEmptyHint" style="display:none;">Zatím žádné zápisky. Napiš první nahoře ⬆️</p>
    </div>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/diary.js"></script>
  <script>registerServiceWorker();</script>
</body>
</html>
