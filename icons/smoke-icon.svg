<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cigarette stick -->
  <rect x="32" y="50" width="6" height="40" rx="2" fill="#888888"/>
  
  <!-- Cigarette paper wrapper - lighter shade -->
  <rect x="32" y="50" width="6" height="40" rx="2" fill="none" stroke="#999999" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Filter tip (lighter) -->
  <rect x="31" y="45" width="8" height="5" rx="1" fill="#aaaaaa" opacity="0.7"/>
  
  <!-- Glowing tip -->
  <circle cx="35" cy="92" r="2.5" fill="#888888" opacity="0.8"/>
  <circle cx="35" cy="92" r="1.5" fill="#999999" opacity="0.6"/>
  
