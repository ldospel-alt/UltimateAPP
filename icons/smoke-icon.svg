<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cigarette stick -->
  <rect x="30" y="55" width="8" height="35" rx="2" fill="#888888"/>
  <!-- Paper wrapper -->
  <line x1="30" y1="55" x2="38" y2="55" stroke="#aaaaaa" stroke-width="1"/>
  <!-- Smoke cloud 1 -->
  <circle cx="35" cy="35" r="8" fill="#888888" opacity="0.4"/>
  <!-- Smoke cloud 2 -->
  <circle cx="42" cy="28" r="10" fill="#888888" opacity="0.35"/>
  <!-- Smoke cloud 3 -->
  <circle cx="30" cy="25" r="9" fill="#888888" opacity="0.3"/>
  <!-- Smoke cloud 4 -->
  <circle cx="50" cy="32" r="7" fill="#888888" opacity="0.3"/>
  <!-- Glowing tip -->
  <circle cx="34" cy="90" r="3" fill="#999999"/>
</svg>
