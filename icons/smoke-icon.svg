  <path d="M 38 42 Q 42 38 45 40 Q 48 42 45 48 Q 42 50 38 48 Z" fill="#888888" opacity="0.5"/>
  <path d="M 45 35 Q 50 30 55 32 Q 58 35 55 42 Q 50 45 45 42 Z" fill="#888888" opacity="0.4"/>
  <path d="M 30 40 Q 25 36 22 38 Q 20 42 25 48 Q 30 50 33 46 Z" fill="#888888" opacity="0.45"/>
  <path d="M 52 42 Q 58 38 62 40 Q 65 44 62 50 Q 58 52 52 48 Z" fill="#888888" opacity="0.35"/>
  <path d="M 40 28 Q 45 22 50 24 Q 53 28 50 35 Q 45 38 40 34 Z" fill="#888888" opacity="0.3"/>
  
  <!-- Additional light smoke wisps -->
  <path d="M 35 20 Q 40 15 45 18" stroke="#888888" stroke-width="1" opacity="0.2"/>
  <path d="M 48 25 Q 52 20 56 22" stroke="#888888" stroke-width="0.8" opacity="0.15"/>
