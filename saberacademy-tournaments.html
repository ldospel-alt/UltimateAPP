<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Turnaje – SaberAcademy</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111318" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="back-btn" href="saberacademy.html">←</a>
    <h1>🏆 Turnaje</h1>
  </div>
  <main class="container">
    <section class="card">
      <div class="field"><label for="tournamentSeason">Ročník</label><select id="tournamentSeason"></select></div>
      <div class="saber-tournament-types" role="group" aria-label="Typ turnaje">
        <button class="btn secondary" type="button" data-tournament-type="championship">Championship</button>
        <button class="btn secondary" type="button" data-tournament-type="league">League</button>
      </div>
      <div class="saber-tournament-toolbar">
        <button id="refreshTournamentBtn" class="btn secondary" type="button">Aktualizovat</button>
        <button id="unlockTournamentBtn" class="btn ghost" type="button">Zapisovat (trenér)</button>
      </div>
      <p id="tournamentUpdatedAt" class="saberacademy-note"></p>
      <p id="tournamentStatus" class="saberacademy-note"></p>
    </section>

    <section id="tournamentStandingsCard" class="card">
      <h2>Tabulka výsledků</h2>
      <div class="saber-table-wrap">
        <table class="saber-tournament-table">
          <thead><tr><th>Přezdívka</th><th>Kostým</th><th>Duelů</th><th>Soutěžních</th><th>Dal(a)</th><th>Dostal(a)</th><th>Výhry</th><th>Dal−Dostal</th><th>Výhry 1:0</th><th>Výhry 2. rukou</th><th>Duely v kostýmu</th><th>Poznámka</th></tr></thead>
          <tbody id="tournamentStandings"></tbody>
        </table>
      </div>
      <p id="tournamentEmptyHint" class="empty-hint" hidden>Turnaj ještě nezačal.</p>
    </section>

    <section id="tournamentResultsCard" class="card" hidden>
      <h2>Odehrané duely</h2>
      <div id="tournamentResults"></div>
    </section>

    <section id="tournamentCoachCard" class="card" hidden>
      <h2>Trenérský zápis</h2>
      <div class="field"><label for="tournamentToken">GitHub token</label><input id="tournamentToken" type="password" autocomplete="off" placeholder="Fine-grained PAT s Contents: write" /></div>
      <div class="saber-tournament-toolbar">
        <button id="saveTournamentTokenBtn" class="btn secondary" type="button">Nastavit GitHub token</button>
        <button id="removeTournamentTokenBtn" class="btn ghost" type="button">Odstranit token</button>
      </div>
      <p class="saberacademy-note">Token se ukládá jen do tohoto zařízení a nikdy není součástí zálohy.</p>

      <div class="saber-tournament-participants">
        <h3>Účastníci</h3>
        <div class="field"><label for="participantName">Přezdívka</label><input id="participantName" type="text" autocomplete="off" /></div>
        <label class="saber-tournament-check"><input id="participantCostume" type="checkbox" /> Kostým</label>
        <button id="addParticipantBtn" class="btn secondary block" type="button">Přidat účastníka</button>
        <div id="tournamentParticipants"></div>
      </div>
    </section>

    <section id="tournamentFormCard" class="card" hidden>
      <h2 id="tournamentFormTitle">Zapsat duel</h2>
      <div class="field"><label for="tournamentDate">Datum</label><input id="tournamentDate" type="date" /></div>
      <div class="field"><label for="tournamentA">První bojovník</label><select id="tournamentA"></select></div>
      <div class="field"><label for="tournamentB">Druhý bojovník</label><select id="tournamentB"></select></div>
      <div class="stat-row">
        <div class="field" style="flex:1;"><label for="tournamentScoreA">Body prvního</label><input id="tournamentScoreA" type="number" min="0" inputmode="numeric" /></div>
        <div class="field" style="flex:1;"><label for="tournamentScoreB">Body druhého</label><input id="tournamentScoreB" type="number" min="0" inputmode="numeric" /></div>
      </div>
      <label class="saber-tournament-check"><input id="tournamentCostume" type="checkbox" /> Kostým</label>
      <label class="saber-tournament-check"><input id="tournamentSecondHand" type="checkbox" /> Výhra 2. rukou</label>
      <div class="field"><label for="tournamentNote">Poznámka</label><textarea id="tournamentNote" placeholder="Volitelná poznámka k duelu"></textarea></div>
      <button id="saveTournamentBtn" class="btn block" type="button">Uložit duel</button>
      <button id="cancelTournamentEditBtn" class="btn ghost block" type="button" hidden>Zrušit úpravu</button>
    </section>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/saberacademy-tournaments.js"></script>
  <script>registerServiceWorker();</script>
</body>
</html>
